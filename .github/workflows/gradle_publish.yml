# This workflow creates a signed Android Bundle which can be uploaded to Play Store Console
#
# @author Armin Schnabel
# @version 1.0.0
# @since 3.1.4
name: Gradle Publish

on:
  push:
    tags:
      # GitHub filter pattern, not a reg-ex: `+` means one or more of the previous character, `*` means any text
      - '[0-9]+.[0-9]+.[0-9]+*'

# Explicit workflow permissions
permissions:
  contents: write  # Required for creating releases
  packages: read   # Required to install the Cyface packages

jobs:
  publish:
    # No if-protection needed: write permission needed to push tags, not allowed for forks
    runs-on: ubuntu-26.04

    env:
      # Never use `github.ref_name` directly in a script: a tag name can contain shell commands
      TAG: ${{ github.ref_name }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        # Does not work out of the box with a private repository
        # see https://github.com/actions/checkout/issues/287
        with:
          #submodules: true
          # Do not keep the write token on the runner after the checkout, where build scripts and dependencies can read it
          persist-credentials: false
      - name: Link Deploy Keys for Submodules
        # Third-party actions are pinned to a commit SHA: a tag or branch of a third-party action can change
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          # This allows to add multiple individual deploy keys for multiple private submodules
          # for a guide, see https://github.com/marketplace/actions/webfactory-ssh-agent
          ssh-private-key: |
            ${{ secrets.SSH_DEPLOY_KEY_CAMERA_SERVICE }}
      - name: Checkout submodules
        run: git submodule update --init --recursive

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Add sentry.properties
        env:
          SENTRY_API_TOKEN: ${{ secrets.SENTRY_API_TOKEN }}
        run: |
          echo "defaults.project=android-app" > sentry.properties
          echo "defaults.org=cyface-eu" >> sentry.properties
          echo "auth.token=$SENTRY_API_TOKEN" >> sentry.properties

      - name: Add gradle.properties
        env:
          GITHUB_USER: ${{ github.actor }}
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLIC_API: ${{ secrets.PUBLIC_API }}
          PUBLIC_PROVIDER_API: ${{ secrets.PUBLIC_PROVIDER_API }}
          PUBLIC_INCENTIVES_API: ${{ secrets.PUBLIC_INCENTIVES_API }}
          PUBLIC_OAUTH_DISCOVERY: ${{ secrets.PUBLIC_OAUTH_DISCOVERY }}
          GOOGLE_MAPS_KEY: ${{ secrets.GOOGLE_MAPS_KEY }}
          GOOGLE_MAPS_KEY_R4R: ${{ secrets.GOOGLE_MAPS_KEY_R4R }}
          DIGURAL_API: ${{ secrets.DIGURAL_API }}
        run: |
          # Use the repository's automatically set up token to install the Cyface packages
          cp gradle.properties.template gradle.properties
          echo "githubUser=$GITHUB_USER" >> gradle.properties
          echo "githubToken=$GITHUB_PACKAGES_TOKEN" >> gradle.properties
          # Inject Cyface APIs URL
          echo "cyface.api=$PUBLIC_API" >> gradle.properties
          echo "cyface.provider_api=$PUBLIC_PROVIDER_API" >> gradle.properties
          echo "cyface.incentives_api=$PUBLIC_INCENTIVES_API" >> gradle.properties
          echo "cyface.oauth_discovery=$PUBLIC_OAUTH_DISCOVERY" >> gradle.properties
          # Inject OAuth redirect URIs
          echo "cyface.oauth_redirect=de.cyface.app:/oauth2redirect" >> gradle.properties
          echo "cyface.oauth_redirect.r4r=de.cyface.app.r4r:/oauth2redirect" >>gradle.properties
          echo "cyface.oauth_redirect.digural=de.cyface.app.digural:/oauth2redirect" >> gradle.properties
          # Inject Google Maps API key
          echo "google.maps_api_key=$GOOGLE_MAPS_KEY" >> gradle.properties
          echo "google.maps_api_key.r4r=$GOOGLE_MAPS_KEY_R4R" >> gradle.properties
          # Digural
          echo "digural.api=$DIGURAL_API" >> gradle.properties

      # As we previously published the app with version code up to 320, we need add this as offset
      - name: Calculate versionCode
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          echo "VERSION_CODE=$((GITHUB_RUN_NUMBER + 320))" >> $GITHUB_ENV

      # VersionCode and versionName are required to publish the app to Play Store
      - name: Set versionCode and versionName
        run: |
          sed -i "s/versionName = \"0.0.0\"/versionName = \"$TAG\"/g" build.gradle
          sed -i "s/versionCode = 1/versionCode = $VERSION_CODE/g" build.gradle

      - name: Build App
        run: ./gradlew bundleRelease

      # The signing action is pinned to the commit of its tag `v1` (no update since 2020, runs on Node 12)
      - name: Sign Digural App
        id: sign_app_digural
        uses: r0adkll/sign-android-release@349ebdef58775b1e0d8099458af0816dc79b6407 # v1
        with:
          releaseDirectory: ui/digural/build/outputs/bundle/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.SIGNING_ALIAS }}
          keyStorePassword: ${{ secrets.SIGNING_KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }} # optional

      - name: Sign R4R App
        id: sign_app_r4r
        uses: r0adkll/sign-android-release@349ebdef58775b1e0d8099458af0816dc79b6407 # v1
        with:
          releaseDirectory: ui/r4r/build/outputs/bundle/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.SIGNING_ALIAS }}
          keyStorePassword: ${{ secrets.SIGNING_KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }} # optional

      - name: Sign Cyface App
        id: sign_app
        uses: r0adkll/sign-android-release@349ebdef58775b1e0d8099458af0816dc79b6407 # v1
        with:
          releaseDirectory: ui/cyface/build/outputs/bundle/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.SIGNING_ALIAS }}
          keyStorePassword: ${{ secrets.SIGNING_KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }} # optional

      # We currently upload the app manually to Play Store, but we could automate this using a
      # Google Service Account and the Github Action `r0adkll/upload-google-play`.
      - name: Make Digural app available
        uses: actions/upload-artifact@v7
        with:
          name: Signed Digural Bundle
          path: ${{ steps.sign_app_digural.outputs.signedReleaseFile }}
      - name: Make R4R app available
        uses: actions/upload-artifact@v7
        with:
          name: Signed R4R Bundle
          path: ${{ steps.sign_app_r4r.outputs.signedReleaseFile }}
      - name: Make Cyface app available
        uses: actions/upload-artifact@v7
        with:
          name: Signed Cyface Bundle
          path: ${{ steps.sign_app.outputs.signedReleaseFile }}

      # Automatically mark this tag as release on Github. The message of the tag, without its first line, becomes the release notes.
      - name: Mark tag as release on Github
        run: |
          # A tag with a suffix, for example `1.2.3-beta1`, is a pre-release
          case "$TAG" in *-*) PRERELEASE=--prerelease ;; *) PRERELEASE= ;; esac
          gh release create "$TAG" \
            --title "$TAG" \
            --notes "$(git tag -l --format='%(contents:body)' "$TAG")" \
            $PRERELEASE
        env:
          # `gh` reads these variables: the token for the login, the repository which gets the release
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
